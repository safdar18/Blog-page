<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Secure Blog Platform</h1>
      <p>Create blogs, react, rate, and comment.</p>
    </header>

    <main>
      <section class="card">
        <h2>Create User ID / Register</h2>
        <form id="register-form">
          <input type="text" id="register-userid" placeholder="User ID (letters/numbers/_ only)" required />
          <input type="email" id="register-email" placeholder="Email" required />
          <input type="password" id="register-password" placeholder="Password (min 8 chars)" required />
          <button type="submit">Register</button>
        </form>
      </section>

      <section class="card">
        <h2>Authentication / Login</h2>
        <form id="login-form">
          <input type="text" id="login-identifier" placeholder="User ID or Email" required />
          <input type="password" id="login-password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
      </section>

      <section class="card" id="create-blog-section">
        <h2>Create Blog</h2>
        <form id="blog-form">
          <input type="text" id="blog-title" placeholder="Blog title" required />
          <textarea id="blog-content" placeholder="Write your blog content..." required></textarea>
          <input type="file" id="blog-image" accept="image/*" />
          <button type="submit">Publish Blog</button>
        </form>
      </section>

      <section class="card">
        <h2>Blogs</h2>
        <div id="blogs"></div>
      </section>

      <p id="status"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
